<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Life OS</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #090506; font-family: Georgina, Georgia, serif; color: #fff; }
    .login-box { background: #120609; border: 1px solid rgba(116, 27, 49, 0.5); border-radius: 1rem; padding: 4rem 3rem; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.8); max-width: 25rem; }
    .login-box h1 { margin: 0 0 .5rem; font-size: 2.2rem; color: #e6abb9; font-weight: normal; }
    .login-box p { color: rgba(255, 255, 255, 0.65); font-family: sans-serif; font-size: .9rem; margin-bottom: 2.5rem; line-height: 1.5; }
    .btn-google { background: #fff; color: #000; border: none; padding: .8rem 1.5rem; border-radius: 2rem; font-family: sans-serif; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .8rem; width: 100%; transition: .3s; }
    .btn-google:hover { background: #e6e6e6; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Life OS</h1>
    <p>Your private command center. Please sign in to access your secure dashboard.</p>
    <button class="btn-google" id="googleSignInBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBQ1-Vqeby3cKoTrQjf5sbJp5N8FzkjM04",
      authDomain: "life-style-66bc1.firebaseapp.com",
      projectId: "life-style-66bc1",
      storageBucket: "life-style-66bc1.firebasestorage.app",
      messagingSenderId: "1006152009625",
      appId: "1:1006152009625:web:9f28bf274a35a3fb52b508"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById('googleSignInBtn').addEventListener('click', () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          console.error("Error signing in: ", error);
          alert("Sign in failed. Please try again.");
        });
    });
  </script>
</body>
</html>
